set-window-option -g mode-keys vi
set-option -g focus-events on
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
set -g mouse on
# default-shell intentionally omitted — tmux inherits login shell (zsh on macOS, bash on Linux)

# Open new panes/windows in the current directory
bind  c  new-window      -c "#{pane_current_path}"
bind  %  split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"


# Copy to clipboard — auto-detects macOS / Linux Wayland / Linux X11
bind-key -T copy-mode-vi v send-keys -X begin-selection
if-shell "command -v pbcopy" {
    bind-key -T copy-mode-vi y                 send-keys -X copy-pipe-and-cancel "pbcopy"
    bind-key -T copy-mode-vi Enter             send-keys -X copy-pipe-and-cancel "pbcopy"
    bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
} {
    if-shell "[ -n \"$WAYLAND_DISPLAY\" ] && command -v wl-copy" {
        bind-key -T copy-mode-vi y                 send-keys -X copy-pipe-and-cancel "wl-copy"
        bind-key -T copy-mode-vi Enter             send-keys -X copy-pipe-and-cancel "wl-copy"
        bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
    } {
        bind-key -T copy-mode-vi y                 send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
        bind-key -T copy-mode-vi Enter             send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
        bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
    }
}


# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'
